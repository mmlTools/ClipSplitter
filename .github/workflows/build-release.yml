name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Package, and Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Show .NET SDK
        run: dotnet --info

      - name: Resolve next version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $tags = Invoke-RestMethod `
            -Method Get `
            -Uri "https://api.github.com/repos/$env:OWNER/$env:REPO/tags?per_page=100" `
            -Headers $headers

          $latestTag = $tags |
            Where-Object { $_.name -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object {
              $parts = $_.name.TrimStart("v").Split(".")
              [pscustomobject]@{
                Name = $_.name
                Major = [int]$parts[0]
                Minor = [int]$parts[1]
                Patch = [int]$parts[2]
              }
            } |
            Sort-Object Major, Minor, Patch -Descending |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($latestTag)) {
            $tag = "v1.0.0"
          } else {
            $patch = $latestTag.Patch + 1
            $tag = "v$($latestTag.Major).$($latestTag.Minor).$patch"
          }

          $semver = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          Write-Host "Next release tag: $tag"

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}

      - name: Publish
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64 /p:Version=${{ steps.version.outputs.semver }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath ClipSplitter-${{ steps.version.outputs.tag }}-win-x64.zip -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
          ZIP_PATH: ClipSplitter-${{ steps.version.outputs.tag }}-win-x64.zip
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseBody = @{
            tag_name = $env:TAG
            target_commitish = $env:SHA
            name = "ClipSplitter $env:TAG"
            body = "Automated ClipSplitter build for $env:TAG."
            draft = $false
            prerelease = $false
            generate_release_notes = $true
          } | ConvertTo-Json

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:OWNER/$env:REPO/releases" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $releaseBody

          $uploadHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Content-Type" = "application/zip"
          }

          $uploadUri = "https://uploads.github.com/repos/$env:OWNER/$env:REPO/releases/$($release.id)/assets?name=$env:ZIP_PATH"
          Invoke-RestMethod `
            -Method Post `
            -Uri $uploadUri `
            -Headers $uploadHeaders `
            -InFile $env:ZIP_PATH
