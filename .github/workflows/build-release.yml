name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Package, and Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $latestTag = git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($latestTag)) {
            $tag = "v1.0.0"
          } else {
            $parts = $latestTag.TrimStart("v").Split(".")
            $patch = [int]$parts[2] + 1
            $tag = "v$($parts[0]).$($parts[1]).$patch"
          }

          $semver = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          Write-Host "Next release tag: $tag"

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}

      - name: Publish
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64 /p:Version=${{ steps.version.outputs.semver }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath ClipSplitter-${{ steps.version.outputs.tag }}-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSplitter-${{ steps.version.outputs.tag }}-win-x64
          path: ClipSplitter-${{ steps.version.outputs.tag }}-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClipSplitter ${{ steps.version.outputs.tag }}
          files: ClipSplitter-${{ steps.version.outputs.tag }}-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
