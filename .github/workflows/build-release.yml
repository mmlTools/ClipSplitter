name: Build and Attach to Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            archive: zip

          - os: ubuntu-latest
            runtime: linux-x64
            archive: tar.gz

          - os: macos-latest
            runtime: osx-x64
            archive: tar.gz

          - os: macos-latest
            runtime: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Read presets
        id: presets
        shell: pwsh
        run: |
          $preset = Get-Content presets.json | ConvertFrom-Json

          if (-not $preset.version) {
            throw "presets.json is missing version."
          }

          $appName = if ($preset.appName) { $preset.appName } else { "ClipSplitter" }
          $version = $preset.version
          $tag = "v$version"

          "appName=$appName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore /p:Version=${{ steps.presets.outputs.version }}

      - name: Publish
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true --output artifacts/${{ matrix.runtime }} /p:Version=${{ steps.presets.outputs.version }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "${{ steps.presets.outputs.appName }}-${{ steps.presets.outputs.tag }}-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.runtime }}/*" -DestinationPath $asset -Force
          "ASSET_PATH=$asset" >> $env:GITHUB_ENV

      - name: Package Linux/macOS
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="${{ steps.presets.outputs.appName }}-${{ steps.presets.outputs.tag }}-${{ matrix.runtime }}.tar.gz"
          tar -czf "$asset" -C "artifacts/${{ matrix.runtime }}" .
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name || steps.presets.outputs.tag }}" "$ASSET_PATH" --clobber