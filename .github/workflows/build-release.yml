name: Build and Attach to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v1.0.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            archive: zip

          - os: ubuntu-latest
            runtime: linux-x64
            archive: tar.gz

          - os: macos-latest
            runtime: osx-x64
            archive: tar.gz

          - os: macos-latest
            runtime: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read presets
        id: presets
        shell: pwsh
        run: |
          $preset = Get-Content presets.json | ConvertFrom-Json

          if (-not $preset.version) {
            throw "presets.json is missing version."
          }

          $appName = if ($preset.appName) { $preset.appName } else { "ClipSplitter" }
          $version = $preset.version
          $releaseTag = "${{ github.event.release.tag_name || inputs.tag }}"
          if (-not $releaseTag) {
            $releaseTag = "v$version"
          }

          "appName=$appName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "releaseTag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore /p:Version=${{ steps.presets.outputs.version }}

      - name: Publish app
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true --output artifacts/${{ matrix.runtime }} /p:Version=${{ steps.presets.outputs.version }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "${{ steps.presets.outputs.appName }}-${{ steps.presets.outputs.releaseTag }}-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.runtime }}/*" -DestinationPath $asset -Force
          "ASSET_PATH=$asset" >> $env:GITHUB_ENV

      - name: Build Windows installer
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          $appName = "${{ steps.presets.outputs.appName }}"
          $version = "${{ steps.presets.outputs.version }}"
          $installer = "$appName-${{ steps.presets.outputs.releaseTag }}-${{ matrix.runtime }}-setup.exe"
          $publishDir = (Resolve-Path "artifacts/${{ matrix.runtime }}").Path
          $icon = (Resolve-Path "app-icon.ico").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          @"
          #define AppName "$appName"
          #define AppVersion "$version"
          #define PublishDir "$publishDir"
          #define OutputBaseName "$($installer -replace '\.exe$','')"

          [Setup]
          AppId={{8E4F5A37-8EA6-4EE4-9A9E-73C4A7E5DB28}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=ClipSplitter
          DefaultDirName={autopf}\{#AppName}
          DefaultGroupName={#AppName}
          UninstallDisplayIcon={app}\ClipSplitterApp.exe
          SetupIconFile=$icon
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          OutputDir=.
          OutputBaseFilename={#OutputBaseName}
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "{#PublishDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#AppName}"; Filename: "{app}\ClipSplitterApp.exe"

          [Run]
          Filename: "{app}\ClipSplitterApp.exe"; Description: "Launch {#AppName}"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 installer.iss

          & $iscc installer.iss
          "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV

      - name: Package Linux/macOS
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="${{ steps.presets.outputs.appName }}-${{ steps.presets.outputs.releaseTag }}-${{ matrix.runtime }}.tar.gz"
          tar -czf "$asset" -C "artifacts/${{ matrix.runtime }}" .
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=("$ASSET_PATH")
          if [ -n "${INSTALLER_PATH:-}" ]; then
            assets+=("$INSTALLER_PATH")
          fi
          gh release upload "${{ steps.presets.outputs.releaseTag }}" "${assets[@]}" --clobber