name: Build and Release

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to use, for example v1.0.0. Leave empty to auto-increment.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      semver: ${{ steps.version.outputs.semver }}
      package_tag: ${{ steps.version.outputs.package_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              tag="v1.0.0"
            else
              version="${latest_tag#v}"
              IFS='.' read -r major minor patch <<< "$version"
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            fi
          fi

          semver="${tag#v}"
          package_tag="$(echo "$tag" | sed 's/[^A-Za-z0-9._-]/-/g')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "package_tag=$package_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

  publish:
    name: Publish ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rid: win-x64
          - name: macOS
            os: macos-latest
            rid: osx-x64
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore /p:Version=${{ needs.version.outputs.semver }}

      - name: Publish
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }} /p:Version=${{ needs.version.outputs.semver }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath ClipSplitter-${{ needs.version.outputs.package_tag }}-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSplitter-${{ needs.version.outputs.package_tag }}-${{ matrix.rid }}
          path: ClipSplitter-${{ needs.version.outputs.package_tag }}-${{ matrix.rid }}.zip

  release:
    name: Create GitHub Release
    needs:
      - version
      - publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: ClipSplitter-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClipSplitter ${{ needs.version.outputs.tag }}
          files: release-artifacts/*.zip
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
