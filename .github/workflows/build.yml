name: Build

on:
  release:
    types:
      - created
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v1.0.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-package-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rid: win-x64
          - name: macOS
            os: macos-latest
            rid: osx-x64
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Resolve package tag
        id: package
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "release" -and $env:RELEASE_TAG -ne "") {
            $tag = $env:RELEASE_TAG
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_TAG -ne "") {
            $tag = $env:INPUT_TAG
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "dev"
          }
          $safeTag = $tag -replace '[^A-Za-z0-9._-]', '-'
          "tag=$safeTag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClipSplitterApp.sln

      - name: Build
        run: dotnet build ClipSplitterApp.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ClipSplitterApp/ClipSplitterApp.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath ClipSplitter-${{ steps.package.outputs.tag }}-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSplitter-${{ steps.package.outputs.tag }}-${{ matrix.rid }}
          path: ClipSplitter-${{ steps.package.outputs.tag }}-${{ matrix.rid }}.zip

  release:
    name: Upload GitHub Release Assets
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: ClipSplitter-*
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ClipSplitter ${{ steps.release.outputs.tag }}
          files: release-artifacts/*.zip
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
